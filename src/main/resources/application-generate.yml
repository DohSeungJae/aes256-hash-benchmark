# 데이터 생성기 프로필 (계획서 6장).
# 실행 예: java -jar ahbench.jar --spring.profiles.active=generate
spring:
  main:
    web-application-type: none
    banner-mode: off
  flyway:
    enabled: false

bench:
  generator:
    total-rows: ${GEN_TOTAL_ROWS:10000000}
    # 100만 건씩 10개 파일로 분할 저장 (계획서 6장: 중간 실패 시 이어서 할 수 있도록)
    chunk-size: ${GEN_CHUNK_SIZE:1000000}
    thread-count: ${GEN_THREADS:8}
    output-dir: ${GEN_OUTPUT_DIR:./data}
    email-domain: ${GEN_EMAIL_DOMAIN:bench.example.com}
    start-seq: ${GEN_START_SEQ:1}
